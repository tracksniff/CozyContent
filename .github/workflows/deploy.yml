name: Deploy Cosycontent Frontend
on:
  push:
    branches:
      - frontend
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Pull latest frontend changes
            cd ~/CosyContent/frontend/CozyContent
            git pull origin frontend
            # Rebuild only the cosycontent react frontend
            cd ~/orchestrator
            docker compose build cosycontent-react
            # Restart only the cosycontent react frontend (everything else stays running)
            docker compose up -d cosycontent-react
            # Clean up dangling images from the build
            docker image prune -f
