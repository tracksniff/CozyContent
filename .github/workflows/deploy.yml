name: Deploy Backend
on:
  push:
    branches:
      - backend
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Pull latest backend changes
            cd ~/CosyContent/backend/CozyContent
            git pull origin backend
            # Redeploy Django and Celery containers via orchestrator
            cd ~/orchestrator
            docker compose stop cosycontent-django cosycontent-worker cosycontent-beat
            docker compose rm -f cosycontent-django cosycontent-worker cosycontent-beat
            docker compose build cosycontent-django cosycontent-worker cosycontent-beat
            docker compose up -d --no-deps cosycontent-django cosycontent-worker cosycontent-beat
            # Clean up
            docker image prune -f
            echo "Backend deployed successfully!"
